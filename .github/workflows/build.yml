name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build APK using official Kivy Docker image
        run: |
          docker run --rm \
            --entrypoint sh \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            kivy/buildozer -c "yes | sdkmanager --licenses > /dev/null; buildozer android debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nfc-scanner-apk
          path: bin/*.apk
